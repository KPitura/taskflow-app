<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Zarządzanie Zadaniami</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>TaskFlow</h1>
            <p>System zarządzania zadaniami zespołowymi</p>
        </header>
        <form id="task-form">
            <input type="text" id="task-input" placeholder="Wpisz treść nowego zadania..." required>
            <button type="submit">Dodaj</button>
        </form>
        <ul id="task-list"></ul>
    </div>
    <script src="app.js"></script>
</body>
</html>
